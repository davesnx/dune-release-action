name: 'dune-release'
description: 'Automatically run dune-release in GitHub Actions'
author: 'davesnx'
branding:
  icon: 'package'
  color: 'orange'

inputs:
  packages:
    description: 'Package name(s) for release. Supports: single package, YAML list, JSON array, or comma-separated string'
    required: true
  changelog:
    description: 'Path to changelog file. Defaults to ./CHANGES.md.'
    required: false
    default: './CHANGES.md'
  github-token:
    description: 'GitHub token for API access'
    required: true
  to-opam-repository:
    description: 'If true, submits a PR to opam-repository'
    required: false
    default: 'true'
  to-github-releases:
    description: 'If true, creates a GitHub release'
    required: false
    default: 'true'
  verbose:
    description: 'If true, shows detailed logging output'
    required: false
    default: 'false'
  include-submodules:
    description: 'If true, includes git submodules in the distribution tarball'
    required: false
    default: 'false'
  opam-repository:
    description: 'Target opam repository in owner/repo format (e.g., ocaml/opam-repository)'
    required: false
    default: 'ocaml/opam-repository'
  build-dir:
    description: 'Build directory for dune-release distribution'
    required: false
  publish-message:
    description: 'Custom message for the GitHub release publication'
    required: false
  pr-preamble-message:
    description: 'Text prepended to the opam-repository pull request description, before the changelog content'
    required: false
  dry-run:
    description: 'Validate setup without publishing. Runs lint, changelog validation, and distrib but skips GitHub release and opam submission'
    required: false
    default: 'false'
  draft:
    description: 'If true, creates the GitHub release as a draft so the tarball can be inspected before publishing. Draft mode skips the opam-repository PR; submit to opam after publishing the release'
    required: false
    default: 'false'
  tag-prefix:
    description: 'Literal prefix to strip from the git tag to get the package version (e.g. "mypkg." turns tag mypkg.1.2.0 into version 1.2.0). The full tag is still passed to dune-release. Defaults to no prefix'
    required: false
    default: ''

outputs:
  version:
    description: 'Package version extracted from the git tag, with tag-prefix removed'
  release-status:
    description: 'Status of the release (success/failed)'
  github-release-url:
    description: 'URL of the created GitHub release. For a draft release this is the repository releases page, where drafts are listed'
  opam-pr-url:
    description: 'URL to create the opam PR'

runs:
  using: 'node24'
  main: 'dist/index.js'
